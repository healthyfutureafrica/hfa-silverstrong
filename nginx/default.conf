# HFA SilverStrong — static site with security headers.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Content-Security-Policy mirrors the <meta> tag in index.html and adds frame-ancestors (header-only).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # Enable once the site is served only over HTTPS:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location = /sw.js {
    # The service worker must always be revalidated so security fixes reach every phone quickly.
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
