# API gateway: the only component reachable from outside. Services listen on internal ports
# (4001-4008) that are never published; this gateway routes the public /api/v1 paths to them and
# refuses every /internal path. In AWS the same role is played by an Application Load Balancer
# (path-based rules) in front of ECS services in private subnets.
pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 1024; }

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server_tokens off;
  client_max_body_size 1m;
  # Docker's internal DNS; re-resolve so restarted containers are found.
  resolver 127.0.0.11 valid=10s ipv6=off;

  log_format api '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout api; # paths and status only: query strings may contain identifiers

  map $http_x_request_id $request_id_header { default $http_x_request_id; "" $request_id; }

  server {
    listen 8080;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id_header;
    proxy_set_header X-Internal-Token ""; # never let clients pass an internal token through

    location /internal/ { return 404; }

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    location /api/v1/auth/          { set $upstream http://auth-service:4001;     proxy_pass $upstream; }
    location /api/v1/patients       { set $upstream http://user-service:4002;     proxy_pass $upstream; }
    location /api/v1/providers      { set $upstream http://user-service:4002;     proxy_pass $upstream; }
    location /api/v1/prescriptions  { set $upstream http://pharmacy-service:4006; proxy_pass $upstream; }
    location /api/v1/payments/      { set $upstream http://payment-service:4005;  proxy_pass $upstream; }
    location /api/v1/surveillance/  {
      set $upstream http://admin-service:4008;
      proxy_pass $upstream;
      proxy_buffering off;           # live Server-Sent Events stream
      proxy_read_timeout 1h;
    }

    location / { return 404 '{"success":false,"data":null,"message":"Route not found"}'; add_header Content-Type application/json; }
  }
}
