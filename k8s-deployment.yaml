apiVersion: apps/v1
kind: Deployment
metadata:
  name: hfa-silverstrong-deployment
  labels:
    app: hfa-silverstrong
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hfa-silverstrong
  template:
    metadata:
      labels:
        app: hfa-silverstrong
    spec:
      containers:
        - name: hfa-silverstrong
          image: hfa-silverstrong:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hfa-silverstrong-service
spec:
  type: LoadBalancer
  selector:
    app: hfa-silverstrong
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hfa-silverstrong-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
    - host: hfa-silverstrong.local
      http:
        paths:
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: hfa-silverstrong-service
                port:
                  number: 80
