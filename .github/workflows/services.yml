name: Services CI

on:
  push:
    branches: [main]
    paths: ['services/**', 'mobile/**', '.github/workflows/services.yml']
  pull_request:
    paths: ['services/**', 'mobile/**', '.github/workflows/services.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/package-lock.json
      - run: npm ci
      - name: Service tests (real PostgreSQL and Redis)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379
      - name: CHW app offline/sync tests
        run: npm run test:mobile

  docker:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, user-service, pharmacy-service, payment-service, admin-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: services
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: hfa/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
