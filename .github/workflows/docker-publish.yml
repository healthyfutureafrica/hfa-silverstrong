name: Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ghcr.io/${{ github.repository }}:smoke
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          docker run -d --rm --name hfa-smoke -p 8080:80 ghcr.io/${{ github.repository }}:smoke
          echo "Polling http://localhost:8080/ ..."
          for i in $(seq 1 15); do
            if curl --silent --fail --max-time 2 http://localhost:8080/ >/tmp/hfa-home.html; then
              echo "Container responded on attempt $i"
              break
            fi
            echo "Attempt $i failed; waiting 1s..."
            sleep 1
          done

          if ! curl --silent --fail --max-time 2 http://localhost:8080/ >/tmp/hfa-home.html; then
            echo "Container did not respond in time"
            docker logs hfa-smoke
            exit 1
          fi

          echo "Smoke test passed"

      - name: Tear down smoke-test container
        if: always()
        run: |
          docker stop hfa-smoke || true
          docker rm hfa-smoke || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image tags
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done