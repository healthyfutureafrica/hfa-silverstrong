  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # needed to push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Build the image locally (no push yet) ──────────────────────────────
      - name: Build Docker image
        run: |
          docker build \
            --tag ghcr.io/healthyfutureafrica/hfa-silverstrong:smoke \
            .

      # ── Smoke test ─────────────────────────────────────────────────────────
      - name: Start smoke-test container
        run: |
          docker run \
            --detach \
            --name hfa-smoke \
            --publish 8080:8080 \
            ghcr.io/healthyfutureafrica/hfa-silverstrong:smoke

      - name: Wait for container to respond (up to 10 s)
        run: |
          echo "Polling http://localhost:8080/ ..."
          for i in $(seq 1 10); do
            if curl --silent --fail --max-time 2 http://localhost:8080/; then
              echo "✓ Container responded on attempt $i"
              exit 0
            fi
            echo "  attempt $i failed — waiting 1 s"
            sleep 1
          done
          echo "✗ Container did not respond within 10 s — dumping logs:"
          docker logs hfa-smoke
          exit 1

      # Always tears down — even if the smoke test step above failed
      - name: Tear down smoke-test container
        if: always()
        run: |
          docker stop hfa-smoke  || true
          docker rm   hfa-smoke  || true

      # ── Publish — only on pushes to main, never on PRs ────────────────────
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image as :latest and :<commit-sha>
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHA=${{ github.sha }}

          # Re-tag with both final names
          docker tag \
            ghcr.io/healthyfutureafrica/hfa-silverstrong:smoke \
            ghcr.io/healthyfutureafrica/hfa-silverstrong:latest

          docker tag \
            ghcr.io/healthyfutureafrica/hfa-silverstrong:smoke \
            ghcr.io/healthyfutureafrica/hfa-silverstrong:${SHA}

          # Push both tags
          docker push ghcr.io/healthyfutureafrica/hfa-silverstrong:latest
          docker push ghcr.io/healthyfutureafrica/hfa-silverstrong:${SHA}

          echo "Published :latest and :${SHA}"