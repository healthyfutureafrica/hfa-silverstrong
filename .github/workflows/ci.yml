name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (html-validate)
        run: npm run lint

      - name: Run tests (jest)
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=ci-smoke

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          docker run -d --rm --name hfa-smoke -p 8080:8080 ghcr.io/${{ github.repository }}:ci-smoke
          echo "Polling http://localhost:8080/ ..."
          for i in $(seq 1 15); do
            if curl --silent --fail --max-time 2 http://localhost:8080/ >/tmp/hfa-home.html; then
              echo "Container responded on attempt $i"
              break
            fi
            echo "Attempt $i failed; waiting 1s..."
            sleep 1
          done

          if ! curl --silent --fail --max-time 2 http://localhost:8080/ >/tmp/hfa-home.html; then
            echo "Container did not respond in time"
            docker logs hfa-smoke
            exit 1
          fi

          echo "Smoke test passed"

      - name: Tear down smoke-test container
        if: always()
        run: |
          docker stop hfa-smoke || true
          docker rm hfa-smoke || true
