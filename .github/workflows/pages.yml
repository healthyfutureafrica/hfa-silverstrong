name: Publish shareable demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Explain Pages setup if unavailable
        if: failure()
        run: |
          echo "GitHub Pages is not enabled for this repository. In Settings > Pages, set Build and deployment to GitHub Actions, then rerun this workflow."
          exit 1

      - name: Prepare Pages artifact
        run: node scripts/build-static.js

      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published demo
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          asset_url="${SITE_URL%/}/assets/hfa-logo.svg"
          for attempt in {1..10}; do
            page_status="$(curl --silent --location --max-time 10 --output /tmp/hfa-pages.html --write-out '%{http_code}' "$SITE_URL" 2>/dev/null || true)"
            asset_status="$(curl --silent --location --max-time 10 --output /dev/null --write-out '%{http_code}' "$asset_url" 2>/dev/null || true)"
            if [[ "$page_status" == "200" && "$asset_status" == "200" ]] && grep -q 'id="lnd-signin"' /tmp/hfa-pages.html; then
              echo "Published demo and logo are available at $SITE_URL"
              exit 0
            fi
            echo "Published demo not ready (page=$page_status, logo=$asset_status), retry $attempt/10"
            sleep 6
          done
          echo "Published demo failed its HTTP/content check at $SITE_URL"
          exit 1
