name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/hfa-silverstrong:${{ github.ref_name }}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Output image
        run: echo "Published image: ghcr.io/${{ github.repository_owner }}/hfa-silverstrong:${{ github.ref_name }}"
