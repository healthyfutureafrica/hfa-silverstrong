version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: hfa-silverstrong:local
    ports:
      - '8080:80'
    restart: unless-stopped

  cache:
    image: redis:alpine
    ports:
      - '6379:6379'
    restart: unless-stopped

networks:
  default:
    driver: bridge
