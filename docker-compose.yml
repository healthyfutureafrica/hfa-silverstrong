services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.source: https://github.com/healthyfutureafrica/hfa-silverstrong
    image: hfa-silverstrong:local
    ports:
      - '127.0.0.1:${HFA_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: hfa-silverstrong-backend:local
    env_file:
      - path: .env
        required: false
    environment:
      PORT: '3000'
      DATABASE_PATH: /app/data/hfa.sqlite
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:${HFA_PORT:-8080}}
      TRUST_PROXY: 'true'
    volumes:
      - backend-data:/app/data
    expose:
      - '3000'
    restart: unless-stopped

volumes:
  backend-data:
